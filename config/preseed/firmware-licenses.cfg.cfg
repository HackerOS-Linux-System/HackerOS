# Wstępna akceptacja licencji pakietów firmware z non-free-firmware.
# Bez tego dpkg w chroocie live-build (frontend noninteractive) kończy się błędem:
#   "firmware-ipw2x00 agree question could not be asked"
# i cały "lb build" się przerywa. Pakiet firmware-ipw2x00 jest wciągany
# przez firmware-linux z config/package-lists/live.list.chroot.
firmware-ipw2x00 firmware-ipw2x00/license/accepted boolean true
firmware-ivtv firmware-ivtv/license/accepted boolean true
firmware-iwlwifi firmware-iwlwifi/license/accepted boolean true
firmware-ralink firmware-ralink/license/accepted boolean true
