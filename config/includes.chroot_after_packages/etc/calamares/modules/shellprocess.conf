# Domyslna instancja modulu shellprocess (uzywana w settings.conf jako
# "- shellprocess", po module "displaymanager"): usuwa z zainstalowanego
# systemu konto live "user" oraz jego pozostalosci (sudo NOPASSWD, autologin,
# znacznik .live). Skrypt jest w obrazie: patrz
# /usr/share/HackerOS/Scripts/remove-live-user.sh
---
dontChroot: false
timeout: 120
script:
  - "/bin/sh /usr/share/HackerOS/Scripts/remove-live-user.sh"
