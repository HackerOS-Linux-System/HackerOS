# HackerOS - edycja HWDE: sesja HWDE (labwc) zamiast KDE Plasma.
# Plik sortuje się po plikach Official (zz-), więc nadpisuje ich Session=.
# Celowo BEZ User= - nie włączamy tu autologinu, tylko wskazujemy sesję;
# konto/autologin live ustawia reszta konfiguracji Official, a Calamares
# w zainstalowanym systemie.
[Autologin]
