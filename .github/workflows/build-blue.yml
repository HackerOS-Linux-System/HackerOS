name: Build HackerOS Blue
# Osobny workflow budujący WYŁĄCZNIE edycję "blue" (dokładnie to samo, co
# .github/workflows/build.yml robi dla matrix.edition == "blue" -
# checkout -> Lua 5.5 ze źródeł -> live-build ze źródeł -> `lua5.5
# build.lua --blue` -> zmiana nazwy ISO -> sumy kontrolne -> artefakt),
# ale z DODATKOWYM wyborem:
#
#   1) skąd ma pochodzić sama binarka blue-environment, którą
#      `build/build-hackeros-blue` zapisuje pod
#      config/includes.chroot_after_packages/usr/share/Blue-Environment/blue-environment
#      (czyli /usr/share/Blue-Environment/blue-environment w gotowym ISO):
#        - "release" (domyślnie) - pobranie gotowej binarki z GitHub Releases
#          repozytorium HackerOS-Linux-System/Blue-Environment (jak dotychczas -
#          patrz zmienna BLUE_ENV_VERSION niżej, domyślnie pinowana na "v0.8",
#          albo "latest" dla najnowszego wydania);
#        - "source" - `git clone` repozytorium Blue-Environment (gałąź/tag/commit
#          z blue_env_ref) i zbudowanie go od zera (npm install + npm run
#          build:tauri), dokładnie jak w .github/workflows/build.yml repo
#          Blue-Environment.
#
#   2) który display manager ma być domyślny (autostartowany na starcie
#      systemu): "sddm" (domyślnie, z autologinem - patrz
#      helpers/blue/hooks/normal/sddm-autologin.hook.chroot) albo "hdm"
#      (HackerOS Display Manager - patrz helpers/blue/hooks/normal/hdm.hook.chrokt).
#      Oba menedżery i tak trafiają do obrazu ISO niezależnie od tego
#      wyboru - decyduje on wyłącznie, który z nich zostanie WŁĄCZONY
#      jako aktywny przy starcie (patrz plik-znacznik
#      /etc/hackeros/blue-default-dm, zapisywany przez
#      build/build-hackeros-blue i odczytywany przez oba hooki).
#
# Oba wybory trafiają do build/build-hackeros-blue przez zmienne
# środowiskowe BLUE_ENV_SOURCE / BLUE_ENV_VERSION / BLUE_ENV_REF oraz
# BLUE_DEFAULT_DM - patrz ten skrypt, sekcje na jego początku.
on:
  workflow_dispatch:
    inputs:
      blue_env_source:
        description: >-
          Skad wziac binarke blue-environment. "release" = pobranie
          gotowej binarki z GitHub Releases repo Blue-Environment
          (szybciej). "source" = git clone + zbudowanie od zera (npm
          install + npm run build:tauri) - wolniej, ale zawsze z
          najswiezszych zrodel wskazanego brancha/commita.
        required: true
        default: "release"
        type: choice
        options:
          - release
          - source
      blue_env_version:
        description: >-
          Tag wydania Blue Environment do pobrania (np. "v0.8", albo
          "latest" dla najnowszego) - UZYWANE WYLACZNIE gdy powyzej
          wybrano blue_env_source=release. Ignorowane dla "source".
        required: false
        default: "v0.8"
        type: string
      blue_env_ref:
        description: >-
          Galaz / tag / commit SHA repozytorium Blue-Environment do
          zbudowania - UZYWANE WYLACZNIE gdy wybrano
          blue_env_source=source. Ignorowane dla "release".
        required: false
        default: "main"
        type: string
      blue_default_dm:
        description: >-
          Domyslny display manager edycji Blue. "sddm" (domyslnie) -
          logowanie graficzne przez SDDM z autologinem (patrz
          helpers/blue/hooks/normal/sddm-autologin.hook.chroot). "hdm" -
          logowanie przez HDM, czyli HackerOS Display Manager (patrz
          helpers/blue/hooks/normal/hdm.hook.chrokt). Oba menedzery i tak
          trafiaja do obrazu ISO niezaleznie od wyboru - mozna recznie
          przelaczyc sie na drugi po starcie systemu ("systemctl enable
          sddm.service" / "systemctl enable starthdm.service").
        required: true
        default: "sddm"
        type: choice
        options:
          - sddm
          - hdm
env:
  # Ta sama wersja Lua co w .github/workflows/build.yml (patrz identyczny
  # komentarz tam) - Lua 5.5 nie ma jeszcze paczki w repozytoriach Ubuntu,
  # wiec kompilujemy ja recznie.
  LUA_VERSION: "5.5.0"
concurrency:
  group: build-blue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Odczyt wersji z config.hk
        id: version
        run: |
          VERSION=$(awk -F'=>' '/version[[:space:]]*=>/ { gsub(/[[:space:]]/, "", $NF); print $NF }' config.hk | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Nie udało się odczytać wersji z ./config.hk (oczekiwany format: 'version => X.Y' pod [metadata])" >&2
            exit 1
          fi
          echo "Wersja odczytana z config.hk: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Aktualizacja listy pakietów
        run: sudo apt-get update

      - name: Instalacja podstawowych narzędzi
        run: |
          sudo apt-get install -y --no-install-recommends \
            tar \
            git \
            curl \
            ca-certificates \
            build-essential \
            make \
            gcc \
            libreadline-dev

      - name: Instalacja Pythona 3.13 (deadsnakes PPA)
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13 python3.13-venv python3.13-dev

      - name: Budowa i instalacja Lua ${{ env.LUA_VERSION }} ze źródeł
        run: |
          curl -fL -o "lua-${LUA_VERSION}.tar.gz" \
            "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz"
          tar -xzf "lua-${LUA_VERSION}.tar.gz"
          cd "lua-${LUA_VERSION}"
          make linux -j"$(nproc)"
          sudo make install
          cd ..
          # Patrz identyczny komentarz w .github/workflows/build.yml -
          # tworzymy symlinki lua5.5/luac5.5, bo domyślny "make install"
          # instaluje binarki bez numeru wersji.
          sudo ln -sf "$(command -v lua)" /usr/local/bin/lua5.5
          sudo ln -sf "$(command -v luac)" /usr/local/bin/luac5.5
          hash -r
          lua5.5 -v

      - name: Instalacja live-build (najnowsza wersja ze źródeł Debian Live Team) i narzędzi do tworzenia obrazu ISO
        run: |
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            dosfstools \
            mtools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            mtd-utils \
            build-essential \
            devscripts \
            debhelper \
            po4a
          # Patrz identyczny komentarz w .github/workflows/build.yml -
          # pakiet "live-build" z repozytoriów Ubuntu jest zbyt stary, więc
          # budujemy najnowszą wersję ze źródeł Debian Live Team.
          rm -rf /tmp/live-build-src
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build-src; then
              break
            fi
            echo "Próba $attempt/5 klonowania live-build nie powiodła się, ponawiam za 15s..."
            rm -rf /tmp/live-build-src
            sleep 15
            if [ "$attempt" = "5" ]; then
              echo "Błąd: nie udało się sklonować live-build po 5 próbach."
              exit 1
            fi
          done
          cd /tmp/live-build-src
          dpkg-buildpackage -b -uc -us
          cd ..
          sudo apt-get remove -y live-build || true
          sudo dpkg -i live-build_*.deb
          lb --version

      # ------------------------------------------------------------------
      # Zależności systemowe + Node/Rust -- POTRZEBNE WYŁĄCZNIE, gdy
      # blue_env_source=source (npm install / npm run build:tauri wewnątrz
      # build/build-hackeros-blue). Dla blue_env_source=release binarka
      # jest po prostu pobierana z GitHub Releases, więc te kroki są
      # pomijane (oszczędza to kilka-kilkanaście minut na każdym buildzie
      # w trybie release, czyli domyślnym).
      # ------------------------------------------------------------------
      - name: Instalacja zależności systemowych Tauri v2 (WYŁĄCZNIE blue_env_source=source)
        if: inputs.blue_env_source == 'source'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libudev-dev file

      - name: Instalacja Node.js (WYŁĄCZNIE blue_env_source=source)
        if: inputs.blue_env_source == 'source'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalacja Rust (WYŁĄCZNIE blue_env_source=source)
        if: inputs.blue_env_source == 'source'
        uses: dtolnay/rust-toolchain@stable

      - name: Uruchomienie build.lua --blue
        env:
          BLUE_ENV_SOURCE: ${{ inputs.blue_env_source }}
          BLUE_ENV_VERSION: ${{ inputs.blue_env_version }}
          BLUE_ENV_REF: ${{ inputs.blue_env_ref }}
          BLUE_DEFAULT_DM: ${{ inputs.blue_default_dm }}
        run: |
          chmod +x build.lua
          lua5.5 build.lua --blue

      - name: Weryfikacja binarki blue-environment i wyboru display managera w drzewie ISO
        run: |
          BIN="config/includes.chroot_after_packages/usr/share/Blue-Environment/blue-environment"
          if [ ! -x "$BIN" ]; then
            echo "Błąd: $BIN nie istnieje albo nie ma bitu wykonywalnego po build.lua --blue." >&2
            echo "(Ten plik ląduje jako /usr/share/Blue-Environment/blue-environment w gotowym ISO.)" >&2
            exit 1
          fi
          echo "OK: $BIN istnieje i jest wykonywalny (trafi do ISO jako /usr/share/Blue-Environment/blue-environment)."
          file "$BIN" || true

          DM_MARKER="config/includes.chroot_after_packages/etc/hackeros/blue-default-dm"
          if [ ! -f "$DM_MARKER" ]; then
            echo "Błąd: $DM_MARKER nie istnieje po build.lua --blue." >&2
            exit 1
          fi
          DM_VALUE="$(cat "$DM_MARKER")"
          if [ "$DM_VALUE" != "${{ inputs.blue_default_dm }}" ]; then
            echo "Błąd: $DM_MARKER zawiera '$DM_VALUE', a oczekiwano '${{ inputs.blue_default_dm }}'." >&2
            exit 1
          fi
          echo "OK: domyślny display manager = $DM_VALUE (plik-znacznik $DM_MARKER)."

      - name: Wyszukanie zbudowanych obrazów ISO
        id: find_iso
        run: |
          echo "iso_found=$(find . -maxdepth 3 -iname '*.iso' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Zmiana nazwy obrazu ISO
        id: rename_iso
        if: steps.find_iso.outputs.iso_found != ''
        run: |
          SRC="${{ steps.find_iso.outputs.iso_found }}"
          DEST="HackerOS-V${{ steps.version.outputs.version }}-blue.iso"
          mv -- "$SRC" "$DEST"
          echo "Zmieniono nazwę: $SRC -> $DEST"
          echo "iso_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Wygenerowanie sum kontrolnych obrazu ISO (SHA256 / SHA512)
        if: steps.find_iso.outputs.iso_found != ''
        run: |
          ISO="${{ steps.rename_iso.outputs.iso_path }}"
          sha256sum "$ISO" > "${ISO}.sha256sum"
          sha512sum "$ISO" > "${ISO}.sha512sum"
          echo "--- ${ISO}.sha256sum ---"
          cat "${ISO}.sha256sum"
          echo "--- ${ISO}.sha512sum ---"
          cat "${ISO}.sha512sum"

      - name: Wgranie ISO jako artefaktu builda
        if: steps.find_iso.outputs.iso_found != ''
        uses: actions/upload-artifact@v4
        with:
          name: HackerOS-V${{ steps.version.outputs.version }}-blue-${{ inputs.blue_env_source }}-${{ inputs.blue_default_dm }}
          path: |
            ${{ steps.rename_iso.outputs.iso_path }}
            ${{ steps.rename_iso.outputs.iso_path }}.sha256sum
            ${{ steps.rename_iso.outputs.iso_path }}.sha512sum
          if-no-files-found: warn
